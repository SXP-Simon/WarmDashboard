{% if titles %}
<div class="an-profile-grid">
    {% for title in titles %}
    <div class="an-profile-card avoid-break">
        <div class="an-cameo-frame">
            <div class="an-cameo-border">
                <svg class="an-cameo-svg" viewBox="0 0 64 64" fill="none">
                    <circle cx="32" cy="32" r="30" stroke="#c9a227" stroke-width="1.5" opacity="0.8"/>
                    <circle cx="32" cy="32" r="27" stroke="#2d5016" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.5"/>
                    <path d="M12 32 C12 20 20 12 32 12 C44 12 52 20 52 32" stroke="#c9a227" stroke-width="0.8" opacity="0.6"/>
                </svg>
                {% if title.avatar_data %}
                <img class="an-avatar-img" src="{{ title.avatar_data }}" alt="{{ title.name }}">
                {% endif %}
            </div>
        </div>
        <div class="an-profile-body">
            <div class="an-profile-header">
                <span class="an-profile-name">{{ title.name }}</span>
                <span class="an-pill-badge an-badge-gold">{{ title.title }}</span>
                {% if title.profile_display or title.mbti %}
                <span class="an-pill-badge an-badge-wisteria">{{ title.profile_display or title.mbti }}</span>
                {% endif %}
            </div>
            <p class="an-profile-reason">{{ title.reason }}</p>
        </div>
    </div>
    {% endfor %}
</div>
{% endif %}
