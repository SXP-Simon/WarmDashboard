{% if titles %}
<div class="profile-grid">
    {% for title in titles %}
    <div class="profile-item avoid-break">
        <div class="avatar-circle">
            {% if title.avatar_data %}
            <img src="{{ title.avatar_data }}" alt="{{ title.name }}">
            {% endif %}
        </div>
        <div class="profile-details">
            <div class="profile-top">
                <span class="profile-name">{{ title.name }}</span>
                <span class="pill-badge teal-pill">✦ {{ title.title }}</span>
                {% if title.profile_display or title.mbti %}
                <span class="pill-badge coral-pill">{{ title.profile_display or title.mbti }}</span>
                {% endif %}
            </div>
            <div class="profile-desc">{{ title.reason }}</div>
        </div>
    </div>
    {% endfor %}
</div>
{% endif %}
