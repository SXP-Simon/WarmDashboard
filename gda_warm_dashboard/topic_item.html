{% if topics %}
<div class="card-header">
    <div class="header-badge bg-teal-dot"></div>
    <h2 class="card-title">今日话题</h2>
</div>
<div class="topic-group">
    {% for topic in topics %}
    <div class="topic-row avoid-break">
        <div class="dot-badge teal-circle">
            <span>{{ "%02d" | format(topic.index) }}</span>
        </div>
        <div class="topic-main">
            <div class="topic-heading">{{ topic.topic.topic }}</div>
            <div class="topic-meta">
                <span class="meta-label">参与群友</span>
                <span class="meta-names">{{ topic.contributors }}</span>
            </div>
            <div class="topic-summary">{{ topic.detail | safe }}</div>
        </div>
    </div>
    {% endfor %}
</div>
{% endif %}
